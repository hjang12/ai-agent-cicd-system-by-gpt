name: Janggi search benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/janggi/search.py'
      - 'projects/personal-ai-janggi-trainer-by-gpt/janggi/core.py'
      - 'projects/personal-ai-janggi-trainer-by-gpt/tools/benchmark_search_ordering.py'
      - '.github/workflows/janggi-search-benchmark.yml'
  pull_request:
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/janggi/search.py'
      - 'projects/personal-ai-janggi-trainer-by-gpt/janggi/core.py'
      - 'projects/personal-ai-janggi-trainer-by-gpt/tools/benchmark_search_ordering.py'
      - 'projects/personal-ai-janggi-trainer-by-gpt/tools/benchmark_ai_versions.py'
      - '.github/workflows/janggi-search-benchmark.yml'

concurrency:
  group: janggi-search-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/personal-ai-janggi-trainer-by-gpt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run search ordering benchmark
        run: PYTHONPATH=. python tools/benchmark_search_ordering.py
      - name: Run selective deepening probe
        run: PYTHONPATH=. python tools/benchmark_selective_deepening.py
      - name: Run timed Lv6 profile benchmark
        run: PYTHONPATH=. python tools/benchmark_timed_level_profile.py
