name: Temporary Janggi game-first UI scenarios

on:
  push:
    branches:
      - "fix/janggi-game-first-setup-flow-20261002"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/personal-ai-janggi-trainer-by-gpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run game-first browser scenarios
        env:
          UI_TEST_ARTIFACT_DIR: ui-test-artifacts
        run: python tools/ui_game_first_scenarios.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janggi-game-first-ui-screenshots
          path: projects/personal-ai-janggi-trainer-by-gpt/ui-test-artifacts/
          if-no-files-found: warn
