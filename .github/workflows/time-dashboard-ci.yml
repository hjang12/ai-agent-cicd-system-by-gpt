name: Time Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/time-dashboard-by-gpt/**'
      - 'render.yaml'
      - '.github/workflows/time-dashboard-ci.yml'
  pull_request:
    paths:
      - 'projects/time-dashboard-by-gpt/**'
      - 'render.yaml'
      - '.github/workflows/time-dashboard-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/time-dashboard-by-gpt
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile timefolio_server.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -p 'test_*.py'
