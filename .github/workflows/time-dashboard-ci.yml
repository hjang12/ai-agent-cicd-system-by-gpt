name: Time Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/time-dashboard-by-gpt/**'
      - 'GOVERNANCE/**'
      - '.github/workflows/time-dashboard-ci.yml'
  pull_request:
    paths:
      - 'projects/time-dashboard-by-gpt/**'
      - 'GOVERNANCE/**'
      - '.github/workflows/time-dashboard-ci.yml'

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/time-dashboard-by-gpt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile timefolio_server.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -p 'test_*.py'
