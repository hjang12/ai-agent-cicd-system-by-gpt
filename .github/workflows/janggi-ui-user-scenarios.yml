name: Janggi UI User Scenarios

on:
  push:
    branches:
      - "test/ui-ux-user-scenarios-20261001"
  workflow_dispatch:

jobs:
  browser-scenarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/personal-ai-janggi-trainer-by-gpt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run user scenario and responsive checks
        env:
          PYTHONUNBUFFERED: "1"
          UI_TEST_ARTIFACT_DIR: ui-test-artifacts
        run: python tools/ui_user_scenarios.py

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janggi-ui-user-scenario-screenshots
          path: projects/personal-ai-janggi-trainer-by-gpt/ui-test-artifacts/
          if-no-files-found: warn
