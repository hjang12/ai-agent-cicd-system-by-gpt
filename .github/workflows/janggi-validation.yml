name: Janggi Python validation

on:
  push:
    branches: [main]
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/**'
      - '.github/workflows/janggi-validation.yml'
  pull_request:
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/**'
      - '.github/workflows/janggi-validation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/personal-ai-janggi-trainer-by-gpt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: python tools/validate_browser_javascript.py
      - name: Compile Python modules
        run: python -m compileall janggi tests tools
      - name: Validate Requirement Contracts
        run: python tools/validate_requirement_contracts.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
