name: Janggi Python validation

on:
  push:
    branches: [main]
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/**'
      - 'GOVERNANCE/**'
      - '.github/workflows/janggi-validation.yml'
  pull_request:
    paths:
      - 'projects/personal-ai-janggi-trainer-by-gpt/**'
      - 'GOVERNANCE/**'
      - '.github/workflows/janggi-validation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/personal-ai-janggi-trainer-by-gpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall janggi tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
