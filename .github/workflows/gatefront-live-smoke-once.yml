name: Gatefront one-time live browser smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gatefront-live-smoke-once.yml'

permissions:
  contents: read

jobs:
  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Verify the deployed Gatefront page and key controls
        env:
          GATEFRONT_URL: https://soldier-gate-runner-by-gpt.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from playwright.sync_api import sync_playwright

          base_url = os.environ["GATEFRONT_URL"]
          failures = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              for label, width, height, mobile in [
                  ("desktop", 1440, 900, False),
                  ("mobile", 390, 844, True),
              ]:
                  page = browser.new_page(
                      viewport={"width": width, "height": height},
                      is_mobile=mobile,
                      has_touch=mobile,
                  )
                  page_errors = []
                  page.on("pageerror", lambda error: page_errors.append(str(error)))
                  response = page.goto(base_url, wait_until="networkidle", timeout=45000)
                  assert response is not None, f"{label}: navigation returned no HTTP response"
                  assert response.status == 200, f"{label}: expected HTTP 200, got {response.status}"
                  assert "Gatefront" in page.title(), f"{label}: unexpected page title"
                  assert page.locator("#gameCanvas").is_visible(), f"{label}: game canvas is not visible"
                  assert page.get_by_role("button", name="Use 3-lane mode").is_visible()
                  assert page.get_by_role("button", name="Use 5-lane mode").is_visible()
                  assert page.get_by_role("button", name="RESET RUN").is_visible()

                  canvas = page.locator("#gameCanvas")
                  assert canvas.get_attribute("data-lane-count") == "3", f"{label}: default is not 3 lanes"
                  page.get_by_role("button", name="Use 5-lane mode").click()
                  page.wait_for_function(
                      "() => document.querySelector('#gameCanvas').dataset.laneCount === '5'",
                      timeout=5000,
                  )
                  assert page.get_by_role("button", name="Use 5-lane mode").get_attribute("aria-pressed") == "true"
                  page.get_by_role("button", name="Use 3-lane mode").click()
                  page.wait_for_function(
                      "() => document.querySelector('#gameCanvas').dataset.laneCount === '3'",
                      timeout=5000,
                  )
                  assert page.get_by_role("button", name="Use 3-lane mode").get_attribute("aria-pressed") == "true"

                  page.wait_for_function(
                      """() => {
                        const topbar = document.querySelector('.topbar').getBoundingClientRect();
                        const hud = document.querySelector('.hud').getBoundingClientRect();
                        return hud.top >= topbar.bottom + 4;
                      }""",
                      timeout=5000,
                  )
                  geometry = page.evaluate("""() => {
                    const rect = selector => {
                      const r = document.querySelector(selector).getBoundingClientRect();
                      return {x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom};
                    };
                    return {
                      topbar: rect('.topbar'),
                      hud: rect('.hud'),
                      canvas: rect('#gameCanvas'),
                      viewport: {width: innerWidth, height: innerHeight},
                      document: {
                        scrollWidth: document.documentElement.scrollWidth,
                        clientWidth: document.documentElement.clientWidth,
                        scrollHeight: document.documentElement.scrollHeight,
                        clientHeight: document.documentElement.clientHeight
                      }
                    };
                  }""")
                  assert geometry["hud"]["y"] >= geometry["topbar"]["bottom"] + 4, (
                      f"{label}: topbar/HUD spacing is insufficient: "
                      + json.dumps(geometry)
                  )
                  assert geometry["document"]["scrollWidth"] <= geometry["document"]["clientWidth"], (
                      f"{label}: horizontal page overflow: " + json.dumps(geometry)
                  )
                  assert geometry["document"]["scrollHeight"] <= geometry["document"]["clientHeight"], (
                      f"{label}: vertical page overflow: " + json.dumps(geometry)
                  )
                  assert not page_errors, f"{label}: browser errors: {page_errors}"
                  print(f"{label.upper()} PASS: HTTP {response.status}; 3L↔5L switching; "
                        f"topbar/HUD gap {geometry['hud']['y'] - geometry['topbar']['bottom']:.1f}px; "
                        f"no page overflow; no browser errors")
                  page.close()
              browser.close()
          PY
