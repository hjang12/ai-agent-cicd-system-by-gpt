services:
  - type: web
    name: personal-ai-janggi-trainer-by-gpt
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    rootDir: projects/personal-ai-janggi-trainer-by-gpt
    buildCommand: python -m compileall janggi tests
    startCommand: python app.py
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - projects/personal-ai-janggi-trainer-by-gpt/**
        - render.yaml

  - type: web
    name: time-dashboard-by-gpt
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    rootDir: projects/time-dashboard-by-gpt
    buildCommand: pip install -r requirements.txt
    startCommand: python timefolio_server.py
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - projects/time-dashboard-by-gpt/**
        - render.yaml

  - type: web
    name: soldier-gate-runner-by-gpt
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: echo "No build step required"
    staticPublishPath: projects/soldier-gate-runner-by-gpt
    buildFilter:
      paths:
        - projects/soldier-gate-runner-by-gpt/**
        - render.yaml

  - type: web
    name: personal-ai-janggi-calibration-runner
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: projects/personal-ai-janggi-trainer-by-gpt
    buildCommand: python -m compileall janggi tests tools
    startCommand: python tools/calibration_runner_service.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
