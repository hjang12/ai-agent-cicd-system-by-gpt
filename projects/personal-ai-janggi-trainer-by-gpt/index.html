<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개인용 AI 장기 훈련기</title>
  <style>
:root{
  color-scheme:light;
  --bg:#eef1f5;
  --surface:#fff;
  --surface-soft:#f7f8fa;
  --ink:#17202d;
  --muted:#6b7482;
  --line:#dde2e9;
  --accent:#3158d4;
  --accent-soft:#edf2ff;
  --cho:#1f7a58;
  --han:#b43b35;
  --board:#d7ae6c;
  --board-dark:#704b24;
  --board-grid:#6a481f;
  --shadow:0 18px 45px #18223417;
  --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  background:linear-gradient(180deg,#f6f8fb 0%,var(--bg) 100%);
  color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select{font:inherit}
button{border:0}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,select:focus-visible{outline:3px solid #3158d455;outline-offset:2px}

/* Setup screen */
.app-shell{width:100%;height:100dvh;position:relative}
.setup-screen{
  position:absolute;inset:0;z-index:40;
  display:grid;place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 8%,#fff 0%,transparent 42%),
    linear-gradient(180deg,#f7f9fc 0%,#edf1f6 100%);
}
.setup-screen.modal{
  position:absolute;
  background:#11182799;
  backdrop-filter:blur(5px);
}
.setup-card{
  width:min(560px,100%);
  max-height:calc(100dvh - 40px);
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:28px;
}
.setup-screen.modal .setup-card{width:min(520px,calc(100vw - 28px));padding:24px}
.setup-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-mark{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:#151c28;color:#fff;font-weight:950;font-size:1.15rem;
  box-shadow:0 6px 18px #18223422;
}
.setup-kicker{font-size:.72rem;color:var(--accent);font-weight:900;letter-spacing:.08em}
.setup-title{margin:2px 0 0;font-size:1.45rem;letter-spacing:-.04em}
.setup-subtitle{margin:0 0 22px;color:var(--muted);font-size:.84rem}
.setup-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 9px}
.setup-heading h2{margin:0;font-size:.84rem}
.setup-heading small{color:var(--muted);font-size:.68rem}
.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.level-option,.side-option{
  min-height:72px;padding:10px;border:1px solid var(--line);border-radius:12px;
  background:#fff;text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;
}
.level-option:hover,.side-option:hover{transform:translateY(-1px);border-color:#b9c4d4}
.level-option.selected,.side-option.selected{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 2px #3158d414 inset;
}
.option-title{display:block;font-weight:900;font-size:.8rem}
.option-sub{display:block;margin-top:3px;color:var(--muted);font-size:.66rem;line-height:1.3}
.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-option{min-height:62px}
.setup-select-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:center}
.setup-select-row label{font-size:.73rem;font-weight:850;color:#4d5664}
select{
  width:100%;height:38px;padding:0 10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);font-weight:800;
}
.setup-note{
  margin-top:8px;padding:9px 10px;border:1px solid #e6eaf0;border-radius:10px;
  background:var(--surface-soft);color:var(--muted);font-size:.68rem;line-height:1.45;
}
.setup-actions{display:flex;gap:8px;margin-top:18px}
.setup-actions button{flex:1}
.primary{
  min-height:44px;padding:9px 14px;border-radius:11px;
  background:var(--accent);color:#fff;font-weight:900;
  box-shadow:0 8px 18px #3158d42b;
}
.secondary{
  min-height:40px;padding:8px 12px;border-radius:10px;
  background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:850;
}
.setup-cancel{display:none}
.setup-screen.modal .setup-cancel{display:block}
.visually-hidden-select{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
  margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;opacity:0!important;pointer-events:none!important;
}

/* Game screen */
.game-screen{
  width:100%;height:100dvh;
  display:grid;
  grid-template-rows:58px minmax(0,1fr) auto;
  gap:8px;
  padding:8px;
  position:relative;
}
.game-header{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:8px;align-items:center;min-width:0;
}
.game-brand{display:flex;align-items:center;gap:9px;min-width:0}
.game-brand .brand-mark{width:34px;height:34px;border-radius:10px;font-size:.9rem}
.game-brand-text{min-width:0}
.game-title{font-weight:900;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-sub{font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-chip{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-width:116px;padding:7px 12px;border:1px solid var(--line);
  border-radius:999px;background:#fff;font-size:.72rem;font-weight:900;
}
.turn-dot{width:8px;height:8px;border-radius:50%;background:#929aa8}
.game-header-actions{display:flex;justify-content:flex-end;gap:7px}
.replay-button{min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:900}

.game-main{
  min-width:0;min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:7px;
}
.players{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:7px;align-items:center;
}
.player-card{
  min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:11px;
  background:#ffffffdd;box-shadow:0 2px 10px #18223408;
}
.player-card.me{border-color:#b8c6e7}
.player-card.opponent{background:#fbfcfd}
.player-top{display:flex;align-items:center;gap:7px;min-width:0}
.player-dot{width:8px;height:8px;border-radius:50%;background:#929aa8;flex:none}
.player-card.side-cho .player-dot{background:var(--cho)}
.player-card.side-han .player-dot{background:var(--han)}
.player-name{font-size:.74rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-level{margin-left:auto;color:var(--muted);font-size:.66rem;white-space:nowrap}
.player-sub{display:none}
.board-wrap{
  min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;
}
.board{
  position:relative;
  width:min(76vw,calc((100dvh - 188px) * 8 / 9),860px);
  height:auto;aspect-ratio:8/9;
  background:
    linear-gradient(135deg,#fff1 25%,transparent 25%) 0 0/12px 12px,
    linear-gradient(315deg,#0001 25%,transparent 25%) 0 0/12px 12px,
    var(--board);
  border:7px solid var(--board-dark);
  border-radius:11px;
  box-shadow:0 18px 40px #2a1c0d2b,0 3px 10px #2a1c0d16;
  touch-action:manipulation;overflow:hidden;
}
.board-lines{position:absolute;inset:5%;width:90%;height:90%;pointer-events:none}
.board-lines g{stroke:var(--board-grid)}
.cell{
  position:absolute;box-sizing:border-box;display:grid;place-items:center;
  width:8.4%;aspect-ratio:1;left:0;top:0;margin:0;padding:0;
  transform:translate(-50%,-50%);background:transparent;color:#211605;
  border:0;cursor:pointer;z-index:1;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.cell.legal{border-radius:50%;box-shadow:inset 0 0 0 3px #fffbc0;background:#3158d416}
.cell.selected{outline:4px solid var(--accent);outline-offset:-2px;border-radius:50%}
.cell.selected .piece{box-shadow:0 0 0 4px var(--accent),0 2px 5px #0004,inset 0 0 0 1px #fff9}
.cell.last-move-from{outline:2px dashed var(--accent);outline-offset:-4px;background:#3158d40d}
.cell.last-move-to{outline:3px solid var(--accent);outline-offset:-4px;background:#3158d420}
.cell.last-move-to .piece{box-shadow:0 0 0 3px var(--accent),0 2px 4px #0003,inset 0 0 0 1px #fff}
.piece{
  width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:#f7ecd8;border:2px solid #6e5a3f;box-shadow:0 2px 4px #0003,inset 0 0 0 1px #fff9;
  font-family:"Noto Serif CJK KR","Noto Serif KR",serif;font-weight:900;line-height:1;
  font-size:clamp(20px,3.8vh,34px)
}
.piece-cho{color:var(--cho);border-color:var(--cho)}
.piece-han{color:var(--han);border-color:var(--han)}
.board-message{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:5;min-width:54%;max-width:84%;padding:14px 18px;border-radius:14px;
  background:#121821ea;color:#fff;text-align:center;pointer-events:none;
  box-shadow:0 12px 30px #0005;font-weight:900;line-height:1.25;
  font-size:clamp(18px,3.4vh,30px);opacity:0;visibility:hidden;
  transition:opacity .15s ease,visibility .15s ease;
}
.board-message.visible{opacity:1;visibility:visible}
.board-message-sub{display:block;margin-top:6px;font-size:.56em;font-weight:700;opacity:.9}
.board-message.thinking .board-message-sub{animation:boardPulse 1.1s ease-in-out infinite}
@keyframes boardPulse{0%,100%{opacity:.55}50%{opacity:1}}

.game-footer{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;align-items:center;
}
.comment-card{
  min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:11px;
  background:#fff;box-shadow:0 2px 10px #18223408;
}
.comment-label{color:var(--accent);font-size:.61rem;font-weight:900}
#status{
  margin:2px 0 0;font-size:.73rem;font-weight:850;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.game-actions{display:flex;gap:7px}
.game-actions .secondary{min-height:40px}
#engine{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.match-result{
  position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,calc(100vw - 28px));padding:18px;
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 60px #1822342b;
}
.match-result[hidden]{display:none}
.result-header{display:flex;align-items:flex-start;gap:8px}
.result-kicker{font-size:.59rem;font-weight:900;color:var(--accent);letter-spacing:.06em}
.match-result h2{margin:2px 0 0;font-size:1rem}
.result-badge{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f4f6f9;border:1px solid var(--line);font-size:.61rem;font-weight:900}
.result-grid{display:flex;gap:7px;margin-top:10px}
.result-stat{flex:1;padding:8px;border:1px solid #e6eaf0;border-radius:9px;background:var(--surface-soft);min-width:0}
.result-stat span{display:block;color:var(--muted);font-size:.57rem}
.result-stat strong{display:block;margin-top:2px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-note{margin:9px 0 0;color:var(--muted);font-size:.61rem;line-height:1.4}
.result-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}

/* Runtime compatibility surfaces are not part of the product UI */
#runtime-compat{display:none!important}
</style>
</head>
<body>
<main class="app-shell">
  <section id="setup-screen" class="setup-screen" aria-label="대국 설정">
    <div class="setup-card">
      <div class="setup-brand">
        <div class="brand-mark" aria-hidden="true">將</div>
        <div>
          <div class="setup-kicker">PERSONAL AI JANGGI TRAINER</div>
          <h1 class="setup-title">대국 준비</h1>
        </div>
      </div>
      <p class="setup-subtitle">장기판에 들어가기 전에 AI 난이도와 내 진영을 선택하세요.</p>

      <div class="setup-heading"><h2>AI 난이도</h2><small id="ai-level-note">선택된 난이도가 표시됩니다.</small></div>
      <div class="level-grid" id="ai-level-options">
        <button class="level-option selected" type="button" data-level="1"><span class="option-title">Lv.1 입문</span><span class="option-sub">가볍게 시작</span></button>
        <button class="level-option" type="button" data-level="2"><span class="option-title">Lv.2 초급</span><span class="option-sub">기본 대응</span></button>
        <button class="level-option" type="button" data-level="3"><span class="option-title">Lv.3 중급</span><span class="option-sub">한 단계 더</span></button>
        <button class="level-option" type="button" data-level="4"><span class="option-title">Lv.4 고급</span><span class="option-sub">전술 대응 강화</span></button>
        <button class="level-option" type="button" data-level="5"><span class="option-title">Lv.5 상급</span><span class="option-sub">깊은 계산</span></button>
        <button class="level-option" type="button" data-level="6"><span class="option-title">Lv.6 전문</span><span class="option-sub">현재 최고 단계</span></button>
      </div>

      <div class="setup-heading"><h2>내 진영</h2><small id="orientation-note">초가 먼저 둡니다.</small></div>
      <div class="side-grid" id="side-options">
        <button class="side-option selected" type="button" data-side="cho"><span class="option-title">초</span><span class="option-sub">초로 플레이 · 선공</span></button>
        <button class="side-option" type="button" data-side="han"><span class="option-title">한</span><span class="option-sub">한으로 플레이 · 초 선공</span></button>
      </div>

      <div class="setup-heading"><h2>장기판 배치</h2><small>필요할 때만 변경</small></div>
      <div class="setup-select-row">
        <label for="setup">배치</label>
        <select id="setup" aria-label="장기판 배치">
          <option value="classic">기본 배치</option>
          <option value="left">왼쪽 마상 교환</option>
          <option value="right">오른쪽 마상 교환</option>
          <option value="both">양쪽 마상 교환</option>
        </select>
      </div>

      <div class="setup-actions">
        <button class="secondary setup-cancel" id="setup-cancel" type="button">취소</button>
        <button class="primary" id="reset" type="button">대국 시작</button>
      </div>
    </div>

    <select id="player-side" class="visually-hidden-select" aria-label="내 진영">
      <option value="cho">초</option><option value="han">한</option>
    </select>
    <select id="ai-level" class="visually-hidden-select" aria-label="AI 레벨">
      <option value="1">Lv.1 입문</option><option value="2">Lv.2 초급</option><option value="3">Lv.3 중급</option>
      <option value="4">Lv.4 고급</option><option value="5">Lv.5 상급</option><option value="6">Lv.6 전문</option>
    </select>
  </section>

  <section id="game-screen" class="game-screen" hidden aria-label="장기 대국">
    <header class="game-header">
      <div class="game-brand">
        <div class="brand-mark" aria-hidden="true">將</div>
        <div class="game-brand-text">
          <div class="game-title">개인 AI 장기</div>
          <div class="game-sub" id="opponent-meta">AI</div>
        </div>
      </div>

      <div class="turn-chip">
        <span class="turn-dot" aria-hidden="true"></span>
        <span id="turn">내 차례</span>
      </div>

      <div class="game-header-actions">
        <button class="replay-button" id="replay-button" type="button">재대국</button>
      </div>
    </header>

    <div class="game-main">
      <div class="players">
        <div class="player-card opponent side-han" id="opponent-card">
          <div class="player-top">
            <span class="player-dot" aria-hidden="true"></span>
            <span class="player-name" id="opponent-name">기준 AI · 한</span>
            <span class="player-level" id="opponent-level">Lv.1 입문</span>
          </div>
        </div>
        <span class="status-chip" id="status-context">내 차례</span>
        <div class="player-card me side-cho" id="player-card">
          <div class="player-top">
            <span class="player-dot" aria-hidden="true"></span>
            <span class="player-name" id="player-name">나 · 초</span>
            <span class="player-level" id="player-rating">—</span>
          </div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="9열 10행 장기판"></div>
      </div>
    </div>

    <footer class="game-footer">
      <div class="comment-card">
        <div class="comment-label">착수 평가</div>
        <p id="status">현재 대국 상태를 불러오는 중입니다…</p>
      </div>
      <div class="game-actions">
        <button class="secondary" id="undo" disabled>한 턴 되돌리기</button>
      </div>
    </footer>

    <section class="match-result" id="match-result" hidden aria-live="polite">
      <div class="result-header">
        <div>
          <div class="result-kicker">대국 종료</div>
          <h2 id="match-result-title">대국 결과</h2>
        </div>
        <div class="result-badge" id="match-result-badge">미평가</div>
      </div>
      <div class="result-grid">
        <div class="result-stat"><span>내 Rating</span><strong id="match-result-rating">—</strong></div>
        <div class="result-stat"><span>이번 대국 변화</span><strong id="match-result-delta">—</strong></div>
        <div class="result-stat"><span>상대</span><strong id="match-result-opponent">—</strong></div>
      </div>
      <p class="result-note" id="match-result-note">대국 결과가 기록됩니다.</p>
      <div class="result-actions">
        <button class="primary" id="postgame-review">대국 복기 시작</button>
        <button class="secondary" id="postgame-training">훈련 문제 만들기</button>
        <button class="secondary" id="postgame-reset">새 대국</button>
      </div>
    </section>
  </section>

  <div id="heading" class="sr-only" aria-live="polite"></div>
  <div id="game-message" class="sr-only" aria-live="polite"></div>

  <div class="dashboard" id="compat-dashboard" hidden></div>
  <div id="runtime-compat" hidden aria-hidden="true">
    <button id="settings-toggle" type="button"></button>
    <button id="learning-toggle" type="button"></button>
    <button id="learning-review" type="button"></button>
    <button id="learning-training" type="button"></button>
    <button id="review" type="button"></button>
    <button id="training" type="button"></button>
    <button id="engine" type="button"></button>
    <span id="match-badge"></span><span id="opponent-rating"></span>
    <span id="player-record"></span><span id="player-rating-status"></span>
    <span id="player-rating-card"></span><span id="player-games"></span><span id="player-win-rate"></span>
    <span id="player-assessment-state"></span><span id="player-assessment-note"></span>
    <div id="analysis"><span id="severity"></span><span id="played"></span><span id="recommended"></span><span id="delta"></span><span id="tactical-risk"></span><span id="tactical-motif"></span><span id="pv"></span><span id="analysis-note"></span><div id="next-action" hidden><span id="action-text"></span></div></div>
    <div class="journey"><span class="journey-step" data-stage="match"></span><span class="journey-step" data-stage="analysis"></span><span class="journey-step" data-stage="assessment"></span><span class="journey-step" data-stage="review"></span><span class="journey-step" data-stage="training"></span><span class="journey-step" data-stage="growth"></span></div>
    <div id="review-panel"><span id="reviewed-count"></span><span id="review-skipped"></span><ul id="review-reasons"></ul><ul id="review-severity"></ul><ul id="review-details"></ul></div>
    <div id="training-panel"><span id="training-summary"></span><span id="training-accuracy"></span><span id="reason-accuracy-summary"></span><ul id="training-list"></ul><div id="training-result"></div></div>
  </div>
</main>

<script>
    const pieceLabels = {
      'guard':'士', 'elephant':'象', 'horse':'馬', 'chariot':'車', 'cannon':'包'
    };
    const severityLabels = {
      'recommended':'추천 수',
      'acceptable':'괜찮은 대안',
      'inaccuracy':'부정확한 수',
      'major_mistake':'큰 실수',
      'unavailable':'분석 불가'
    };
    const tacticalRiskLabels = {

    function currentPosition() {
      return trainingPosition || snapshot;
    }

    function pieceAt(index) {
      const view = currentPosition();
      const code = view.state.board[index];
      if (pendingPlayerMove && !trainingPosition) {
        const srcIndex = pendingPlayerMove.src[1] * 9 + pendingPlayerMove.src[0];
        const dstIndex = pendingPlayerMove.dst[1] * 9 + pendingPlayerMove.dst[0];
        if (index === srcIndex) return null;
        if (index === dstIndex) {
          const sourceCode = view.state.board[srcIndex];
          if (!sourceCode) return null;
          const [pendingSide, pendingKind] = sourceCode.split(':');
          return {side: pendingSide, kind: pendingKind};
        }
      }
      if (!code) return null;
      const [side, kind] = code.split(':');
      return {side, kind};
    }

    function boardSide() {
      return snapshot?.player_side || 'cho';
    }

    function displayToState(x, y) {
      return boardSide() === 'cho' ? [8 - x, 9 - y] : [x, y];
    }

    function samePosition(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    function legalDestination(src, dst) {
      const view = currentPosition();
      return view.legal_moves.some(move => !move.pass && samePosition(move.src, src) && samePosition(move.dst, dst));
    }

    function legalDestinations(src) {
      const view = currentPosition();
      return new Set(view.legal_moves.filter(move => !move.pass && samePosition(move.src, src)).map(move => JSON.stringify(move.dst)));
    }

    function formatPosition(position) {
      if (!Array.isArray(position) || position.length !== 2) return '?';
      const [x, y] = position;
      if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || x >= 9 || y < 0 || y >= 10) return '?';
      return String.fromCharCode(97 + x) + String(y + 1);
    }

    function formatMove(move) {
      if (!move || move.pass) return '패스';
      return formatPosition(move.src) + ' → ' + formatPosition(move.dst);
    }

    function formatPrincipalVariation(moves, startingSide) {
      if (!Array.isArray(moves) || moves.length === 0) return '없음';
      return moves.map((move, index) => {
        const side = index % 2 === 0 ? startingSide : (startingSide === 'cho' ? 'han' : 'cho');
        const label = sideLabels[side] || side || '?';
        return (index + 1) + '. ' + label + ' ' + formatMove(move);
      }).join('  ·  ');
    }
    function formatDelta(value) {
      if (value === null || value === undefined) return '없음';
      return value > 0 ? `+${value}` : String(value);
    }

    function formatTacticalMotifs(motifs) {
      if (!Array.isArray(motifs) || motifs.length === 0) return '없음';
      return motifs.map(motif => tacticalMotifLabels[motif] || motif).join(', ');
    }

        boardMessageTimer = null;

      boardMessage = {title:'', subtitle:'', thinking:false};
      const node = board.querySelector('.board-message');

        node.classList.remove('visible', 'thinking');
        node.querySelector('.board-message-title').textContent = '';
        node.querySelector('.board-message-sub').textContent = '';
        node.querySelector('.board-message-sub').hidden = true;
      }
    }

    function renderBoardMessage() {
      const node = board.querySelector('.board-message');
      if (!node) return;
      const visible = Boolean(boardMessage.title || boardMessage.subtitle);
      node.classList.toggle('visible', visible);
      node.classList.toggle('thinking', boardMessage.thinking);
      node.querySelector('.board-message-title').textContent = boardMessage.title;
      node.querySelector('.board-message-sub').textContent = boardMessage.subtitle;
      node.querySelector('.board-message-sub').hidden = !boardMessage.subtitle;
    }

    function showBoardMessage(title, subtitle = '', {durationMs = 1600, thinking = false} = {}) {
      boardMessageToken += 1;
      const token = boardMessageToken;
      if (boardMessageTimer) {
        clearTimeout(boardMessageTimer);
        boardMessageTimer = null;
      }
      boardMessage = {title, subtitle, thinking};
      renderBoardMessage();
      if (!thinking && durationMs > 0) {
        boardMessageTimer = setTimeout(() => {
          if (token !== boardMessageToken) return;
          boardMessage = {title:'', subtitle:'', thinking:false};
          renderBoardMessage();
          boardMessageTimer = null;
        }, durationMs);
      }
    }

    function terminalMessage(status) {
      const messages = {
        'cho_win':'대국 종료 · 초가 이겼습니다.',
        'han_win':'대국 종료 · 한이 이겼습니다.',
        'draw_bikjang':'대국 종료 · 빅장으로 무승부입니다.',
        'draw_repetition':'대국 종료 · 동일 포지션 반복으로 무승부입니다.',
        'draw_consecutive_pass':'대국 종료 · 연속 한수쉼으로 무승부입니다.',
        'draw_stalemate':'대국 종료 · 스테일메이트로 무승부입니다.'
      };
      return messages[status] || '';
    }

    function moveEventMessage(before, after, moverSide) {
      const parts = [];
      if (before?.in_check && !after?.in_check) {
        parts.push('멍군! ' + (sideLabels[moverSide] || moverSide) + '이(가) 장군을 풀었습니다.');
      }
      if (!before?.in_check && after?.in_check) {
        const targetSide = after.state?.turn;
        parts.push('장군! ' + (sideLabels[moverSide] || moverSide) + '이(가) ' + (sideLabels[targetSide] || targetSide) + '에게 장군을 걸었습니다.');
      }
      if (after?.status && after.status !== 'playing') {
        const terminal = terminalMessage(after.status);
        if (terminal) parts.push(terminal);
      }
      return parts.join(' ');
    }

    function explainIllegalMove(src, dst, view) {
      const piece = pieceAt(src[1] * 9 + src[0]);
      if (!piece) return '선택한 칸에 이동할 기물이 없습니다.';
      const target = pieceAt(dst[1] * 9 + dst[0]);
      if (target && target.side === piece.side) {
        return '같은 편 기물이 있는 칸으로는 이동할 수 없습니다.';
      }
      return pieceMoveHints[piece.kind] || '이 기물의 이동 규칙에 맞지 않는 수입니다.';
    }

      reset.disabled = busy;

      engine.disabled = busy || snapshot?.status !== 'playing' || snapshot?.state?.turn !== snapshot?.ai_side;
      review.disabled = busy || !hasHistory;

      postgameReset.disabled = busy || !terminal;

    function renderTrainingMetrics(metrics) {
      const accuracy = Number(metrics?.accuracy || 0);
      trainingAccuracy.textContent = Math.round(accuracy * 100) + '%';
      const attempts = metrics?.reason_attempts || {};
      const correct = metrics?.reason_correct || {};
      const entries = Object.entries(attempts);
      if (entries.length === 0) {
        reasonAccuracySummary.textContent = '';
        return;
      }
      reasonAccuracySummary.textContent = entries.map(([reason, count]) => {
        const hits = Number(correct[reason] || 0);
        const rate = Math.round((hits / count) * 100);
        return (reasonLabels[reason] || reason) + ' ' + rate + '%';
      }).join(' · ');
    }
    function renderTrainingProblems(result) {
      trainingProblems = result.problems || [];
      activeTrainingProblem = null;
      trainingPosition = null;
      selected = null;
      trainingPanel.hidden = false;
      renderTrainingMetrics(result.metrics);
      const priorityReasons = (result.priority_reason_codes || [])
        .slice(0, 3)
        .map(reason => reasonLabels[reason] || reason);
      const priorityProblems = (result.priority_problem_ids || []).slice(0, 3);
      const problemAttempts = result.metrics?.problem_incorrect || {};
      const repeated = priorityProblems.filter(problemId => Number(problemAttempts[problemId] || 0) > 0);
      const priorityParts = [];
      if (repeated.length) {
        priorityParts.push('반복 오답 문제 ' + repeated.map(problemId => problemId.replace('ply-', '') + '수').join(', '));
      }
      if (priorityReasons.length) {
        priorityParts.push('낮은 정답률 reason ' + priorityReasons.join(', '));
      }
      const diversityNote = result.problem_count > 1 && priorityProblems.length > 1 && result.problem_count > repeated.length
        ? ' 반복 오답만 고르지 않고 다른 문제도 함께 섞었습니다.'
        : '';
      const priorityNote = priorityParts.length
        ? ' ' + priorityParts.join(' · ') + '을 우선했습니다.' + diversityNote
        : ' 아직 관찰된 오답이 없어 최근 문제 순서를 유지했습니다.';
      trainingSummary.textContent = result.problem_count
        ? '복기에서 다시 풀어볼 수 있는 문제 ' + result.problem_count + '개가 생성되었습니다.' + priorityNote
        : '현재 복기 구간에서 생성할 훈련 문제가 없습니다.';
      trainingResult.hidden = true;
      trainingResult.textContent = '';
      trainingList.innerHTML = '';
      if (!trainingProblems.length) return;
      trainingProblems.forEach((problem, index) => {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'secondary';
        button.textContent = (index + 1) + '. ' + (severityLabels[problem.severity] || problem.severity) + ' · ' + problem.prompt;
        button.addEventListener('click', () => selectTrainingProblem(index));
        item.append(button);
        trainingList.append(item);
      });
    }

    function selectTrainingProblem(index) {
      activeTrainingProblem = trainingProblems[index];
      if (!activeTrainingProblem) return;
      trainingPosition = {
        status: 'playing',
        state: activeTrainingProblem.state,
        legal_moves: activeTrainingProblem.legal_moves

      selected = null;
      trainingResult.hidden = true;
      trainingResult.textContent = '';
      heading.textContent = '포지션 훈련 · ' + activeTrainingProblem.prompt;
      status.textContent = '이 포지션에서 더 나은 수를 찾아보세요.';

      if (busy || !snapshot?.state?.history?.length) return;

        renderTrainingProblems(result);
        heading.textContent = '포지션 훈련 문제 준비 완료';
        renderMatchResult();
        renderJourney();
      } catch (error) {
        status.textContent = error.message;

        pendingPlayerMove = null;
        busy = false;
        updateControls();

    function renderAnalysis(result, coaching) {

          reviewReasons.append(item);

        concerns.forEach(entry => {
          const item = document.createElement('li');
          const reasons = (entry.reason_codes || []).map(reason => reasonLabels[reason] || reason).join(', ');
          item.textContent = entry.ply + '수 · ' + formatMove(entry.move) + ' · ' + (severityLabels[entry.severity] || entry.severity) + (reasons ? ' · ' + reasons : '');
          reviewDetails.append(item);
        });
      }
    }
    function renderEngineResult(result) {
      if (!result) { analysisPanel.hidden = true; nextAction.hidden = true; return; }
      analysisPanel.hidden = false;
      nextAction.hidden = true;
      severity.textContent = '엔진 수';
      played.textContent = formatMove(result.best_move);
      recommended.textContent = formatMove(result.best_move);
      delta.textContent = result.score_cp === null || result.score_cp === undefined
        ? '평가 없음'
        : `${formatDelta(result.score_cp)} cp (${sideLabels[result.perspective] || result.perspective || '기준'} 기준)`;
      tacticalRisk.textContent = '엔진 착수 자체는 일반 전술 경고를 표시하지 않음';
      tacticalMotif.textContent = '없음';
      pv.textContent = formatPrincipalVariation(result.principal_variation, result.perspective);
      analysisNote.textContent = result.best_move
        ? '기준 엔진이 선택한 수입니다.'
          + (result.depth ? ` 탐색 깊이 ${result.depth}.` : '')
          + (result.nodes ? ` 확인한 노드 ${result.nodes.toLocaleString()}개.` : '')
        : '현재 위치에서 엔진이 둘 수 있는 수가 없습니다.';
    }


    function assessmentStatusLabel(value) {
      return ({unrated:'미평가', provisional:'임시 평가', established:'평가 확정'})[value] || '미평가';
    }

    function formatWinRate(value) {
      return Number.isFinite(value) ? Math.round(value * 100) + '%' : '0%';
    }

    function playerResultLabel(state) {
      const status = state?.status;
      if (!status || status === 'playing') return '';
      if (status.startsWith('draw_')) return '무승부';
      if (status === 'cho_win') return state.player_side === 'cho' ? '승리' : '패배';
      if (status === 'han_win') return state.player_side === 'han' ? '승리' : '패배';
      return '대국 종료';
    }

    function renderJourney() {
      if (!journeySteps.length) return;
      let current = 'match';
      if (trainingPosition || !trainingPanel.hidden) current = 'training';
      else if (!reviewPanel.hidden) current = 'review';
      else if (snapshot?.status && snapshot.status !== 'playing') current = 'assessment';
      else if (!analysisPanel.hidden) current = 'analysis';
      const order = ['match','analysis','assessment','review','training','growth'];
      const currentIndex = order.indexOf(current);
      journeySteps.forEach(step => {
        const stage = step.dataset.stage;
        const index = order.indexOf(stage);
        step.classList.toggle('active', stage === current);
        step.classList.toggle('done', index >= 0 && index < currentIndex);
      });
    }

    function renderMatchResult() {
      if (!snapshot || snapshot.status === 'playing') {
        matchResult.hidden = true;
        return;
      }
      matchResult.hidden = false;
      const assessment = snapshot.assessment || {};
      const opponent = snapshot.opponent || {};
      const game = assessment.last_game || null;
      const outcome = playerResultLabel(snapshot);
      const modelName = opponent.model_id === 'baseline-search' ? '기준 AI' : (opponent.model_id || 'AI');
      const modelVersion = opponent.model_version ? ' · ' + opponent.model_version : '';
      matchResultTitle.textContent = outcome ? '내 기준 결과 · ' + outcome : '대국 종료';
      matchResultBadge.textContent = game?.rating_eligible ? 'Rating 반영' : '결과만 기록';
      matchResultRating.textContent = assessment.rating ?? '—';
      matchResultDelta.textContent = game?.rating_eligible
        ? (game.rating_delta > 0 ? '+' : '') + game.rating_delta
        : '미평가';
      matchResultOpponent.textContent = modelName + ' · Lv.' + (opponent.ai_level || snapshot.ai_level || '1');
      matchResultNote.textContent = game?.rating_eligible
        ? '상대 model/version' + modelVersion + '과 대국한 시점의 Rating으로 실전 평가에 반영했습니다.'
        : '현재 AI는 강도 보정 전이므로 이번 결과는 승·무·패와 상대 model/version을 실력 증거로만 기록합니다. numeric Rating은 만들지 않습니다.';
      postgameReview.textContent = reviewPanel.hidden ? '대국 복기 시작' : '복기 완료';
      postgameTraining.textContent = trainingPanel.hidden ? '훈련 문제 만들기' : '훈련 진행 중';
      renderJourney();
    }

    function renderAssessment(assessment, opponent) {
      const a = assessment || {};
      const o = opponent || {};
      const hasRating = a.rating !== null && a.rating !== undefined;
      const ratingText = hasRating ? String(a.rating) : '—';
      const statusText = assessmentStatusLabel(a.rating_status);
      playerRating.textContent = hasRating ? ratingText : '평가 준비 중';
      playerRatingCard.textContent = ratingText;
      playerRecord.textContent = (a.wins || 0) + '승 ' + (a.draws || 0) + '무 ' + (a.losses || 0) + '패';
      playerRatingStatus.textContent = statusText;
      playerGames.textContent = String(a.games || 0);
      playerWinRate.textContent = formatWinRate(a.win_rate || 0);
      playerAssessmentState.textContent = statusText;
      playerAssessmentNote.textContent = hasRating
        ? (statusText === '임시 평가'
          ? '평가 데이터가 쌓이는 중입니다. AI 모델이 바뀌어도 당시 상대 정보를 기준으로 기록됩니다.'
          : '실전 대국 결과를 기준으로 계산된 사용자 Rating입니다.')
        : '현재 AI는 아직 강도 보정 전이라 결과를 실력 증거로만 보관합니다.';
      const playerSideValue = snapshot?.player_side || 'cho';
      const aiSideValue = snapshot?.ai_side || (playerSideValue === 'cho' ? 'han' : 'cho');
      playerCard.classList.toggle('side-cho', playerSideValue === 'cho');
      playerCard.classList.toggle('side-han', playerSideValue === 'han');
      opponentCard.classList.toggle('side-cho', aiSideValue === 'cho');
      opponentCard.classList.toggle('side-han', aiSideValue === 'han');
      opponentName.textContent = (o.model_id === 'baseline-search' ? '기준 AI' : (o.model_id || 'AI')) + ' · ' + (sideLabels[aiSideValue] || aiSideValue);
      document.querySelector('#player-name').textContent = '나 · ' + (sideLabels[playerSideValue] || playerSideValue);
      opponentRating.textContent = o.rating === null || o.rating === undefined ? '—' : String(o.rating);
      opponentLevel.textContent = 'Lv.' + (o.ai_level || snapshot?.ai_level || '1') + ' ' + (snapshot?.ai_level_name || '입문');
      opponentMeta.textContent = o.rating === null || o.rating === undefined
        ? 'model_id: ' + (o.model_id || 'unknown') + (o.model_version ? ' · version: ' + o.model_version : ' · version 미지정') + ' · 실력 보정 준비 중'
        : 'model_id: ' + (o.model_id || 'unknown') + (o.model_version ? ' · version: ' + o.model_version : '') + ' · 보정된 상대 Rating';
      const currentStatus = snapshot?.status || 'playing';
      matchBadge.textContent = currentStatus === 'playing' ? '대국 중' : '대국 종료';
      statusContext.textContent = snapshot?.state?.turn === snapshot?.player_side ? '내 차례' : 'AI 응수 중';
    }

    function setMoveComment(coaching, fallback = '') {
      lastMoveCoaching = coaching || null;
      if (!coaching) {
        status.textContent = fallback;
        return;
      }
      const label = severityLabels[coaching.severity] || coaching.severity || '착수 평가';
      const message = coaching.message || '';
      status.textContent = message ? label + ' · ' + message : label;
    }

    function syncSetupOptions() {
      levelOptions.forEach(option => option.classList.toggle('selected', option.dataset.level === aiLevel.value));
      sideOptions.forEach(option => option.classList.toggle('selected', option.dataset.side === playerSide.value));
      const labels = {'1':'입문','2':'초급','3':'중급','4':'고급','5':'상급','6':'전문'};
      aiLevelNote.textContent = '선택: Lv.' + aiLevel.value + ' ' + (labels[aiLevel.value] || '');
      orientationNote.textContent = playerSide.value === 'han'
        ? '한으로 플레이합니다. 초가 먼저 둔 뒤 내 차례가 시작됩니다.'
        : '초로 플레이합니다. 초가 먼저 둡니다.';
    }

    function showSetup(mode = 'initial') {
      setupScreen.classList.toggle('modal', mode === 'modal');
      setupCancel.style.display = mode === 'modal' ? '' : 'none';
      reset.textContent = mode === 'modal' ? '새 대국 시작' : '대국 시작';
      setupScreen.hidden = false;
      if (mode === 'initial') gameScreen.hidden = true;
      document.body.dataset.view = mode;
    }

    function showGame() {
      setupScreen.hidden = true;
      setupScreen.classList.remove('modal');
      gameScreen.hidden = false;
      document.body.dataset.view = 'game';
      reset.textContent = '대국 시작';
    }

    function render() {
      const view = currentPosition();
      renderAssessment(snapshot?.assessment, snapshot?.opponent);
      renderMatchResult();
      board.innerHTML = `
        <svg class="board-lines" viewBox="0 0 8 9" preserveAspectRatio="none" aria-hidden="true">
          <g stroke="var(--line)" stroke-width="0.035" fill="none">
            <line x1="0" y1="0" x2="0" y2="9"></line>
            <line x1="1" y1="0" x2="1" y2="9"></line>
            <line x1="2" y1="0" x2="2" y2="9"></line>
            <line x1="3" y1="0" x2="3" y2="9"></line>
            <line x1="4" y1="0" x2="4" y2="9"></line>
            <line x1="5" y1="0" x2="5" y2="9"></line>
            <line x1="6" y1="0" x2="6" y2="9"></line>
            <line x1="7" y1="0" x2="7" y2="9"></line>
            <line x1="8" y1="0" x2="8" y2="9"></line>
            <line x1="0" y1="0" x2="8" y2="0"></line>
            <line x1="0" y1="1" x2="8" y2="1"></line>
            <line x1="0" y1="2" x2="8" y2="2"></line>
            <line x1="0" y1="3" x2="8" y2="3"></line>
            <line x1="0" y1="4" x2="8" y2="4"></line>
            <line x1="0" y1="5" x2="8" y2="5"></line>
            <line x1="0" y1="6" x2="8" y2="6"></line>
            <line x1="0" y1="7" x2="8" y2="7"></line>
            <line x1="0" y1="8" x2="8" y2="8"></line>
            <line x1="0" y1="9" x2="8" y2="9"></line>
            <line x1="3" y1="0" x2="5" y2="2"></line>
            <line x1="5" y1="0" x2="3" y2="2"></line>
            <line x1="3" y1="7" x2="5" y2="9"></line>
            <line x1="5" y1="7" x2="3" y2="9"></line>
          </g>
        </svg>
        <div class="board-message" aria-live="polite">
          <span class="board-message-title"></span>
          <span class="board-message-sub" hidden></span>
        </div>`;
      const destinations = selected ? legalDestinations(selected) : new Set();
      const history = Array.isArray(view?.state?.history) ? view.state.history : [];
      const lastMove = pendingPlayerMove || (history.length ? history[history.length - 1] : null);
      for (let y = 0; y < 10; y += 1) {
        for (let x = 0; x < 9; x += 1) {
          const [stateX, stateY] = displayToState(x, y);
          const index = stateY * 9 + stateX;
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.type = 'button';
          cell.style.left = (5 + x * 11.25) + '%';
          cell.style.top = (5 + y * 10) + '%';
          const piece = pieceAt(index);
          cell.setAttribute('aria-label', piece
            ? (sideLabels[piece.side] || piece.side) + ' ' + displayPieceLabel(piece) + ' ' + formatPosition([stateX, stateY])
            : '빈 칸 ' + formatPosition([stateX, stateY]));
          if (piece) {
            const pieceNode = document.createElement('span');
            pieceNode.className = 'piece piece-' + piece.side;
            pieceNode.textContent = displayPieceLabel(piece);
            cell.append(pieceNode);
          }
          if (selected && selected[0] === stateX && selected[1] === stateY) cell.classList.add('selected');
          if (lastMove?.src && samePosition(lastMove.src, [stateX, stateY])) cell.classList.add('last-move-from');
          if (lastMove?.dst && samePosition(lastMove.dst, [stateX, stateY])) cell.classList.add('last-move-to');
          if (destinations.has(JSON.stringify([stateX, stateY]))) cell.classList.add('legal');
          cell.addEventListener('click', () => clickCell(x, y));
          board.append(cell);
        }
      }
      renderBoardMessage();
      const turnSide = view.state.turn;
      const terminal = snapshot?.status && snapshot.status !== 'playing';
      const waitingForAi = Boolean(pendingPlayerMove) && !trainingPosition && !terminal;
      turn.textContent = trainingPosition
        ? '훈련 문제 차례: ' + (sideLabels[turnSide] || turnSide)
        : (terminal ? '대국 종료' : (waitingForAi ? 'AI 응수 중' : '현재 차례: ' + (sideLabels[turnSide] || turnSide)));
      status.textContent = trainingPosition
        ? '포지션 훈련 중'
        : (terminal
          ? terminalMessage(snapshot.status)
          : (waitingForAi
            ? '착수 평가 중…'
            : (view.state.turn === snapshot.player_side
              ? '내 차례 · 말을 선택하세요'
              : 'AI 차례 · 응수를 기다리는 중입니다')));
      orientationNote.textContent = boardSide() === 'han'
        ? '한이 화면 아래쪽입니다.'
        : '초가 화면 아래쪽입니다.';
      statusContext.textContent = trainingPosition
        ? '훈련 문제'
        : (terminal ? '대국 종료' : (waitingForAi ? 'AI 응수 중' : (view.state.turn === snapshot.player_side ? '내 차례' : 'AI 응수 중')));
      updateControls();
    }

    async function getState() {
      const response = await fetch('/api/state', {cache:'no-store'});
      snapshot = await readJsonResponse(response);
      pendingPlayerMove = null;
      playerSide.value = snapshot.player_side || 'cho';
      aiLevel.value = snapshot.ai_level || '1';
      setup.value = snapshot.setup || 'classic';
      aiLevelNote.textContent = '현재 AI: Lv.' + (snapshot.ai_level || '1') + ' ' + (snapshot.ai_level_name || '입문') + ' · 레벨 변경은 대국 초기화부터 적용됩니다.';
      orientationNote.textContent = boardSide() === 'cho'
        ? '초가 화면 아래쪽입니다. 초가 먼저 둡니다.'
        : '한이 화면 아래쪽입니다. 초가 위에서 먼저 둡니다.';
      clearTrainingMode();
      selected = null;
      render();
      syncSetupOptions();
      showSetup('initial');
    }

    async function readJsonResponse(response) {
      const raw = await response.text();
      let payload;
      try {
        payload = JSON.parse(raw);
      } catch {
        throw new Error(`서버 응답 형식 오류 (${response.status}). 대국 상태를 다시 확인하세요.`);
      }
      if (!response.ok) throw new Error(payload.error || `요청 실패 (${response.status})`);
      return payload;
    }

    async function post(path, body) {
      const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      return readJsonResponse(response);
    }

    async function waitForPaint() {
      await new Promise(resolve => requestAnimationFrame(resolve));
      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    async function clickCell(x, y) {
      const view = currentPosition();
      if (busy || view.status !== 'playing') return;
      const [stateX, stateY] = displayToState(x, y);
      const current = pieceAt(stateY * 9 + stateX);
      if (!selected) {
        if (current && current.side === snapshot.state.turn) {
          clearBoardMessage();
          selected = [stateX, stateY];
          showGameMessage('');
          status.textContent = '이동할 수 있는 칸을 선택하세요.';
          render();
        }
        return;
      }
      if (selected[0] === stateX && selected[1] === stateY) {
        selected = null; render(); return;
      }
      if (!legalDestination(selected, [stateX, stateY])) {
        status.textContent = explainIllegalMove(selected, [stateX, stateY], view);
        return;
      }
      busy = true;
      updateControls();
      try {
        const move = {src:selected, dst:[stateX, stateY]};
        if (trainingPosition && activeTrainingProblem) {
          status.textContent = '훈련 답안을 확인하는 중입니다…';
          const result = await post('/api/training/answer', {
            problem_id: activeTrainingProblem.problem_id,
            src: move.src,
            dst: move.dst
          });
          renderTrainingAnswer(result);
          selected = null;
          render();
          heading.textContent = result.correct ? '훈련 정답' : '훈련 다시 보기';
          return;
        }

        const beforeSnapshot = snapshot;
        pendingPlayerMove = move;
        selected = null;
        clearBoardMessage();
        showBoardMessage('착수 평가 중…', '이 수를 간단히 확인하고 있습니다.', {thinking:true, durationMs:0});
        render();
        await waitForPaint();

        let preMoveAnalysis = null;
        try {
          preMoveAnalysis = await post('/api/analyze/move', move);
        } catch {
          preMoveAnalysis = null;
        }

        const moveResult = await post('/api/move', move);
        snapshot = moveResult;
        pendingPlayerMove = null;
        clearTrainingMode();
        renderReview(null);
        renderAnalysis(null, null);
        render();

        const humanMessage = moveEventMessage(beforeSnapshot, snapshot, beforeSnapshot.state.turn);
        if (preMoveAnalysis?.coaching) {
          setMoveComment(preMoveAnalysis.coaching);
        } else if (humanMessage) {
          setMoveComment(null, humanMessage);
        } else {
          setMoveComment(null, '착수가 반영되었습니다.');
        }
        if (humanMessage) {
          showGameMessage(humanMessage);
        } else {
          showGameMessage('내 수가 반영되었습니다.');
        }

        if (snapshot.status !== 'playing') {
          const terminal = terminalMessage(snapshot.status);
          showGameMessage(terminal);
          showBoardMessage(terminal || '대국 종료', '', {durationMs:2600});
          heading.textContent = terminal || '대국 종료';
          return;
        }

        const thinkingTitle = humanMessage && humanMessage.includes('장군!')
          ? '장군!'
          : (humanMessage && humanMessage.includes('멍군!') ? '멍군!' : 'AI 생각 중…');
        const thinkingSubtitle = thinkingTitle === 'AI 생각 중…'
          ? 'AI가 다음 수를 계산하고 있습니다.'
          : 'AI가 응수할 수를 계산하고 있습니다.';
        showBoardMessage(thinkingTitle, thinkingSubtitle, {thinking:true, durationMs:0});
        heading.textContent = humanMessage && (humanMessage.includes('장군!') || humanMessage.includes('멍군!'))
          ? humanMessage
          : '내 수 완료 · AI가 생각하는 중';
        status.textContent = 'AI가 수를 계산하는 중입니다…';
        await new Promise(resolve => requestAnimationFrame(resolve));
        const engineResult = await post('/api/engine/move', {});
        const aiBeforeSnapshot = snapshot;
        snapshot = engineResult.snapshot;
        render();
        renderEngineResult(engineResult.analysis);

        const aiMessage = moveEventMessage(aiBeforeSnapshot, snapshot, aiBeforeSnapshot.state.turn);
        if (snapshot.status !== 'playing') {
          const terminal = terminalMessage(snapshot.status);
          showGameMessage(terminal);
          showBoardMessage(terminal || '대국 종료', '', {durationMs:2600});
          heading.textContent = terminal || '대국 종료';
        } else if (aiMessage) {
          showGameMessage(aiMessage);
          const title = aiMessage.includes('장군!') ? '장군!' : '멍군!';
          showBoardMessage(title, '', {durationMs:1800});
          heading.textContent = aiMessage;
        } else {
          showGameMessage('AI의 응수가 완료되었습니다.');
          clearBoardMessage();
          heading.textContent = 'AI가 응수했습니다 · 내 차례';
          setMoveComment(lastMoveCoaching, 'AI가 응수했습니다 · 내 차례입니다.');
        }
      } catch (error) {
        status.textContent = error.message;
        pendingPlayerMove = null;
        selected = null;
        try {
          await getState();
          render();
          clearBoardMessage();
          if (snapshot?.status === 'playing' && snapshot?.state?.turn === snapshot?.player_side) {
            showGameMessage('대국 상태를 다시 확인했습니다.');
            heading.textContent = '대국 상태 복구 · 내 차례';
          } else if (snapshot?.status === 'playing') {
            showGameMessage('AI 응수 상태를 다시 확인했습니다.');
            heading.textContent = 'AI 응수 상태 확인';
          } else {
            const terminal = terminalMessage(snapshot?.status);
            showGameMessage(terminal);
            heading.textContent = terminal || '대국 종료';
          }
        } catch {
          render();
        }
      } finally {
        busy = false;
        updateControls();
      }
    }

    async function runReview() {
      if (busy || !snapshot?.state?.history?.length) return;
      dashboard.classList.add('learning-open');
      learningToggle.classList.add('active');
      learningToggle.setAttribute('aria-expanded', 'true');
      busy = true;
      updateControls();
      try {
        clearTrainingMode();
        analysisPanel.hidden = true;
        nextAction.hidden = true;
        status.textContent = '최근 대국을 복기하는 중입니다…';
        const result = await post('/api/review', {limit: 20});
        renderReview(result);
        heading.textContent = '최근 대국 복기 완료';
        renderMatchResult();
        renderJourney();
      } catch (error) {
        status.textContent = error.message;
      } finally {
        busy = false;
        updateControls();
      }
    }

    function closeDrawers() {
      dashboard.classList.remove('settings-open', 'learning-open');
      settingsToggle.classList.remove('active');
      learningToggle.classList.remove('active');
      settingsToggle.setAttribute('aria-expanded', 'false');
      learningToggle.setAttribute('aria-expanded', 'false');
    }

    settingsToggle.addEventListener('click', () => {});
    learningToggle.addEventListener('click', () => {});

    training.addEventListener('click', startTrainingProblems);
    review.addEventListener('click', runReview);
    learningReview.addEventListener('click', runReview);
    learningTraining.addEventListener('click', startTrainingProblems);
    postgameReview.addEventListener('click', runReview);
    postgameTraining.addEventListener('click', startTrainingProblems);
    postgameReset.addEventListener('click', () => showSetup('modal'));

    playerSide.addEventListener('change', syncSetupOptions);
    aiLevel.addEventListener('change', syncSetupOptions);
    levelOptions.forEach(option => option.addEventListener('click', () => {
      aiLevel.value = option.dataset.level;
      syncSetupOptions();
    }));
    sideOptions.forEach(option => option.addEventListener('click', () => {
      playerSide.value = option.dataset.side;
      syncSetupOptions();
    }));
    replayButton.addEventListener('click', () => showSetup('modal'));
    setupCancel.addEventListener('click', () => {
      if (!gameScreen.hidden) showGame();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && setupScreen.classList.contains('modal')) showGame();
    });

    reset.addEventListener('click', async () => {
      busy = true;
      updateControls();
      try {
        pendingPlayerMove = null;
        snapshot = await post('/api/reset', {setup:setup.value, player_side:playerSide.value, ai_level:aiLevel.value});
        clearTrainingMode();
        selected = null;
        lastMoveCoaching = null;
        renderAnalysis(null, null);
        renderReview(null);
        clearBoardMessage();
        render();
        showGame();
        const startMessage = snapshot.player_side === 'han' && snapshot.state.history.length
          ? '한으로 시작 · 초가 먼저 두었습니다.'
          : '대국 시작 · 초가 먼저 둡니다.';
        showGameMessage(startMessage);
        heading.textContent = startMessage;
        showBoardMessage(startMessage, '', {durationMs:1600});
        setMoveComment(null, startMessage);
      }
      catch (error) { status.textContent = error.message; }
      finally { busy = false; updateControls(); }
    });

    undo.addEventListener('click', async () => {
      if (busy || !snapshot?.state?.history?.length) return;
      busy = true;
      updateControls();
      try {
        status.textContent = '내 턴을 되돌리는 중입니다…';
        snapshot = await post('/api/undo', {});
        clearTrainingMode();
        const undoMessage = '내 한 턴 되돌리기 완료 · 다시 내 차례입니다.';
        showGameMessage(undoMessage);
        heading.textContent = undoMessage;
        selected = null;
        renderAnalysis(null, null);
        render();
      } catch (error) {
        status.textContent = error.message;
      } finally {
        busy = false;
        updateControls();
      }
    });

    engine.addEventListener('click', async () => {
      busy = true;
      updateControls();
      try {
        status.textContent = 'AI가 수를 계산하는 중입니다…';
        const aiBeforeSnapshot = snapshot;
        const response = await post('/api/engine/move', {});
        snapshot = response.snapshot;
        clearTrainingMode();
        renderReview(null);
        const aiMessage = moveEventMessage(aiBeforeSnapshot, snapshot, aiBeforeSnapshot.state.turn);
        if (aiMessage) {
          showGameMessage(aiMessage);
          heading.textContent = aiMessage;
        } else {
          const manualMessage = snapshot.status === 'playing'
            ? (response.analysis.best_move ? 'AI가 수를 두었습니다 · 내 차례' : 'AI 수가 없습니다 · 내 차례')
            : (terminalMessage(snapshot.status) || '대국 종료');
          showGameMessage(manualMessage);
          heading.textContent = manualMessage;
        }
        selected = null;
        render();
        renderEngineResult(response.analysis);
      } catch (error) {
        status.textContent = error.message;
        try {
          await getState();
          render();
          if (snapshot?.status === 'playing' && snapshot?.state?.turn === snapshot?.player_side) {
            heading.textContent = '대국 상태를 복구했습니다 · 내 차례';
            status.textContent = '요청 중 오류가 있었지만 현재 대국 상태를 다시 확인했습니다.';
          } else if (snapshot?.status === 'playing') {
            heading.textContent = 'AI 응수 상태를 다시 확인했습니다';
            status.textContent = '현재 서버 대국 상태를 다시 표시했습니다.';
          }
        } catch {
          render();
        }
      } finally { busy = false; updateControls(); }
    });

    getState().catch(error => { status.textContent = error.message; });
  </script>
</body>
